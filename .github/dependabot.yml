# Dependabot — Sprint T1: Automated dependency update PRs
# Weekly schedule for pip (backend) and npm (frontend).

version: 2
updates:
  # Python (pip) — backend
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(pip):"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # These three break the app on their own minors (FastAPI 0.16x hides
        # included routers from `app.routes`; SQLAlchemy 2.1 maps a plain
        # `postgresql://` URL to psycopg 3, which is not installed). Kept out of
        # the group so they arrive as separate PRs and cannot hold the safe
        # updates hostage — see Sprint 786b in tasks/todo.md.
        exclude-patterns:
          - "fastapi"
          - "sqlalchemy"
          - "alembic"
    open-pull-requests-limit: 10

  # JavaScript (npm) — frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(npm):"
    ignore:
      # Pinned to the Node 22 runtime on purpose (PR #197).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support the next TypeScript major yet;
      # take it by hand once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions):"
