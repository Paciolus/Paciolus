# Off-provider Postgres backup — Sprint 778b (ceo-actions §4.4, free GitHub Actions option)
#
# Daily: pg_dump of the Neon production database -> Cloudflare R2 `paciolus-backups`,
# with a manifest (row counts per table, schema fingerprint, alembic revision,
# size, sha256) and retention (default 30 daily + 12 monthly).
#
# Required secrets (none exist yet — the CEO adds them; docs/runbooks/backup-restore.md §2):
#   NEON_BACKUP_DATABASE_URL     — Neon DIRECT connection string (host WITHOUT `-pooler`).
#                                  The pooled host is PgBouncer in transaction mode and
#                                  cannot hold the exported snapshot pg_dump uses.
#   R2_BACKUPS_ENDPOINT          — https://<account-id>.r2.cloudflarestorage.com
#   R2_BACKUPS_BUCKET            — paciolus-backups
#   R2_BACKUPS_ACCESS_KEY_ID     — R2 Object R&W token scoped to paciolus-backups
#   R2_BACKUPS_SECRET_ACCESS_KEY
#
# Verdict = job status. With a secret missing the job FAILS with
# "UNVERIFIED — missing secret X" in the log and step summary: no backup was
# taken, and a green run would say otherwise.
#
# Never add `set -x` here: the connection string is in the environment.

name: Backup — pg_dump to R2 (Daily)

on:
  schedule:
    - cron: "15 7 * * *"  # 07:15 UTC daily
  workflow_dispatch:
    inputs:
      keep_daily:
        description: "Daily backups to keep"
        default: "30"
      keep_monthly:
        description: "Monthly backups to keep"
        default: "12"
      dry_run_retention:
        description: "Take the backup but only list what retention would delete"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-pg-dump
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump -> R2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pin: v7.1.0
        with:
          python-version: "3.12"

      - name: Install backup tooling
        run: pip install -q -r scripts/requirements-backup.txt

      - name: Dump, upload, verify, apply retention
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          R2_BACKUPS_ENDPOINT: ${{ secrets.R2_BACKUPS_ENDPOINT }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
          R2_BACKUPS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUPS_ACCESS_KEY_ID }}
          R2_BACKUPS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUPS_SECRET_ACCESS_KEY }}
          BACKUP_KEEP_DAILY: ${{ inputs.keep_daily || '30' }}
          BACKUP_KEEP_MONTHLY: ${{ inputs.keep_monthly || '12' }}
          DRY_RUN_RETENTION: ${{ inputs.dry_run_retention && '--dry-run-retention' || '' }}
        # Exit code: 0 PASS, 1 FAIL, 2 UNVERIFIED (missing secret) — all non-zero fail the job.
        run: python scripts/pg_backup.py backup --pg-dump-mode docker --workdir "$RUNNER_TEMP/pgdump" $DRY_RUN_RETENTION
