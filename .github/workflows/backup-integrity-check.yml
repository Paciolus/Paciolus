# Backup Integrity Check — Sprint 457 (S1.5 / CC4.2); rewritten for Neon + R2 in Sprint 778b.
#
# Weekly (was monthly): the daily pg_dump job can fail, or be auto-disabled by
# GitHub after 60 days without repo activity, and a monthly check would let a
# month of missing backups pass unnoticed. This catches it within a week.
#
# Checks (scripts/verify_backup_integrity.py):
#   r2_latest_backup     newest pg_dump in R2 is complete, < 26h old, sha256 matches manifest
#   neon_pitr_window     Neon's LIVE history-retention window >= PITR_MIN_DAYS (default 1)
#   neon_default_branch  production branch state is `ready`
#
# Required secrets (docs/runbooks/backup-restore.md §2):
#   R2_BACKUPS_ENDPOINT, R2_BACKUPS_BUCKET, R2_BACKUPS_ACCESS_KEY_ID,
#   R2_BACKUPS_SECRET_ACCESS_KEY, NEON_API_KEY, NEON_PROJECT_ID
#
# Exit status = verdict. PASS green; FAIL red; a missing secret is
# "UNVERIFIED — missing secret X" and also red. A non-PASS verdict opens a
# `dr-failure` issue, or comments on the one already open.

name: Backup Integrity Check (Weekly)

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup-integrity:
    name: Backup Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pin: v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -q -r scripts/requirements-backup.txt

      - name: Run backup integrity check
        id: check
        env:
          R2_BACKUPS_ENDPOINT: ${{ secrets.R2_BACKUPS_ENDPOINT }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
          R2_BACKUPS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUPS_ACCESS_KEY_ID }}
          R2_BACKUPS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUPS_SECRET_ACCESS_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          python scripts/verify_backup_integrity.py --save --report backup-integrity-report.txt || true
          if ! grep -q '^verdict=' "$GITHUB_OUTPUT"; then
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
          fi
          echo "timestamp=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u '+%Y%m')" >> "$GITHUB_OUTPUT"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: backup-integrity-${{ github.run_id }}
          path: |
            docs/08-internal/soc2-evidence/s1/backup-integrity-${{ steps.check.outputs.month }}.txt
            backup-integrity-report.txt
          retention-days: 365
          if-no-files-found: warn

      - name: Open or update the dr-failure issue
        if: steps.check.outputs.verdict != 'PASS'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # pin: v9.0.0
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
          MISSING: ${{ steps.check.outputs.missing }}
          TS: ${{ steps.check.outputs.timestamp }}
        with:
          script: |
            const fs = require('fs');
            let report = '(report file not available)';
            try { report = fs.readFileSync('backup-integrity-report.txt', 'utf8').slice(0, 6000); } catch {}
            const verdict = process.env.VERDICT;
            const missing = process.env.MISSING;
            const title = `[DR ${verdict}] Backup integrity check` + (missing ? ` — missing secret ${missing.replace(/,/g, ', ')}` : '');
            const body = `**Verdict:** ${verdict}\n**Timestamp:** ${process.env.TS}\n**Controls:** S1.5 / CC4.2\n\n` +
              "```\n" + report + "\n```\n\n" +
              `**Runbook:** \`docs/runbooks/backup-restore.md\`\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // One open issue per distinct title: a weekly UNVERIFIED should not file 52 issues.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dr-failure', per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['dr-failure'],
              });
            }

      - name: Verdict
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          if [ "$VERDICT" = "PASS" ]; then
            echo "Backup integrity check PASSED"
            exit 0
          fi
          if [ "$VERDICT" = "UNVERIFIED" ]; then
            echo "::error::UNVERIFIED — missing secret ${MISSING//,/, }. Backups were not checked."
          else
            echo "::error::Backup integrity check FAILED — see the report artifact and the dr-failure issue."
          fi
          exit 1
