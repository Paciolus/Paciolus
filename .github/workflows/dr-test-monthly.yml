# DR Test (Monthly) — Sprint 465; rewritten for Neon + R2 in Sprint 778b.
#
# Two recovery mechanisms, both checked every month:
#   1. integrity     — scripts/verify_backup_integrity.py: newest R2 pg_dump is
#                      complete, < 26h old, and hashes to its manifest; Neon's
#                      live PITR window (read from the Neon API, not the docs)
#                      meets the floor; the production branch is ready.
#   2. restore-drill — backup-restore-drill.yml: restore the newest dump into a
#                      throwaway Postgres and compare tables, row counts,
#                      schema fingerprint and alembic revision to the manifest.
#
# The previous version queried the Render Postgres API for an instance deleted
# 2026-04-22. Sprint 778a's honest-verdict rules are kept exactly:
#   - the job's exit status IS the verdict (PASS green; FAIL and UNVERIFIED red);
#   - three outcomes, and a missing secret is UNVERIFIED with the secret named,
#     never an opaque error or a database-outage-sounding FAIL;
#   - a skipped or crashed check counts as UNVERIFIED/FAIL, never PASS;
#   - a non-PASS verdict files a `dr-failure` issue with the verdict in the title.
#
# Secrets: R2_BACKUPS_ENDPOINT, R2_BACKUPS_BUCKET, R2_BACKUPS_ACCESS_KEY_ID,
#          R2_BACKUPS_SECRET_ACCESS_KEY, NEON_API_KEY, NEON_PROJECT_ID
# Runbook: docs/runbooks/backup-restore.md

name: DR Test (Monthly)

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  integrity:
    name: Backup + PITR integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pin: v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements-backup.txt
      - name: Run integrity checks
        id: check
        env:
          R2_BACKUPS_ENDPOINT: ${{ secrets.R2_BACKUPS_ENDPOINT }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
          R2_BACKUPS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUPS_ACCESS_KEY_ID }}
          R2_BACKUPS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUPS_SECRET_ACCESS_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # The script writes verdict= to GITHUB_OUTPUT before exiting; its exit
        # code is mapped by the verdict job, so this step must not stop the job.
        run: |
          python scripts/verify_backup_integrity.py --report integrity-report.txt || true
          if ! grep -q '^verdict=' "$GITHUB_OUTPUT"; then
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        if: always()
        with:
          name: dr-integrity-${{ github.run_id }}
          path: integrity-report.txt
          retention-days: 365
          if-no-files-found: warn

  restore-drill:
    name: Restore drill
    uses: ./.github/workflows/backup-restore-drill.yml
    secrets: inherit

  verdict:
    name: DR verdict
    needs: [integrity, restore-drill]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # pin: v8.0.2
        with:
          pattern: '*-${{ github.run_id }}'
          merge-multiple: true
        continue-on-error: true

      - name: Combine verdicts
        id: final
        env:
          INTEGRITY: ${{ needs.integrity.outputs.verdict }}
          MISSING: ${{ needs.integrity.outputs.missing }}
          DRILL: ${{ needs.restore-drill.outputs.verdict }}
          DRILL_DETAIL: ${{ needs.restore-drill.outputs.detail }}
        run: |
          # Empty = the job was skipped or crashed before reporting: never a pass.
          INTEGRITY="${INTEGRITY:-UNVERIFIED}"
          DRILL="${DRILL:-UNVERIFIED}"
          OVERALL=PASS
          for R in "$INTEGRITY" "$DRILL"; do
            case "$R" in
              PASS) ;;
              FAIL) OVERALL=FAIL ;;
              *)    [ "$OVERALL" = "FAIL" ] || OVERALL=UNVERIFIED ;;
            esac
          done

          {
            echo "## DR Test — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Backup + PITR integrity (R2 freshness/sha256, Neon PITR window, Neon branch) | $INTEGRITY |"
            echo "| Restore drill (R2 dump → scratch Postgres, parity vs manifest) | $DRILL |"
            echo ""
            if [ -n "$MISSING" ]; then
              echo "**UNVERIFIED — missing secret ${MISSING//,/, }**"
              echo ""
            fi
            if [ -n "$DRILL_DETAIL" ]; then
              echo "Restore drill: $DRILL_DETAIL"
              echo ""
            fi
            case "$OVERALL" in
              PASS) echo "## Overall: ✅ PASS" ;;
              FAIL) echo "## Overall: ❌ FAIL" ;;
              *)    echo "## Overall: ⚠️ UNVERIFIED"
                    echo ""
                    echo "Nothing is known to be broken — and nothing has been verified either."
                    echo "An unverified disaster-recovery posture is not a passing one, so this"
                    echo "run is reported as a failure. See docs/runbooks/backup-restore.md §2." ;;
            esac
            echo ""
            for f in integrity-report.txt drill-report.md; do
              if [ -s "$f" ]; then
                echo "<details><summary>$f</summary>"; echo ""; echo '```'; cat "$f"; echo '```'; echo "</details>"
              fi
            done
            echo ""
            echo "*Generated by DR Test workflow — Sprint 465 / 778b*"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: dr-test-${{ steps.final.outputs.stamp }}
          path: report.md
          retention-days: 365

      - name: Create failure issue
        if: steps.final.outputs.overall != 'PASS'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # pin: v9.0.0
        env:
          DR_VERDICT: ${{ steps.final.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DR Test ${process.env.DR_VERDICT} — ${new Date().toISOString().slice(0,7)}`,
              body: report,
              labels: ['dr-failure']
            });

      # Sprint 778a: THE false-green fix, kept. A verdict that cannot fail the
      # job is a comment, not a check.
      - name: Fail the job when the verdict is not PASS
        if: steps.final.outputs.overall != 'PASS'
        env:
          OVERALL: ${{ steps.final.outputs.overall }}
        run: |
          echo "::error::DR Test verdict: $OVERALL — see the report artifact and the filed issue."
          exit 1
