name: DR Test (Monthly)

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of each month, 6am UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  issues: write

env:
  RENDER_API_BASE: https://api.render.com/v1

jobs:
  dr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pin: v6.0.2

      - name: Set timestamp
        id: ts
        run: echo "stamp=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Check Render PostgreSQL status
        id: render-check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: ${{ secrets.RENDER_POSTGRES_ID }}
        run: |
          echo "## Render PostgreSQL Status Check" > report.md
          echo "" >> report.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> report.md
          echo "**Instance:** $RENDER_POSTGRES_ID" >> report.md
          echo "" >> report.md

          # Sprint 778: three outcomes, not two. A missing credential is not
          # an outage, and this check cannot pass as written regardless —
          # production Postgres moved to Neon in Phase 1 and the orphan Render
          # instance was deleted on 2026-04-22. Saying "status: api_error
          # (expected: available)" reads as a database problem when the real
          # problem is that the check interrogates a database that no longer
          # exists. Rewriting it against Neon is Sprint 778 scope item 4 and
          # needs the connection string (CEO ask D-1).
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_POSTGRES_ID" ]; then
            echo "result=UNVERIFIED" >> "$GITHUB_OUTPUT"
            echo "**Instance Status:** not checked — credentials unset" >> report.md
            echo "" >> report.md
            echo "⚠️ \`RENDER_API_KEY\` / \`RENDER_POSTGRES_ID\` are unset, so this check did not run." >> report.md
            echo "" >> report.md
            echo "> Note: this check targets the **Render** Postgres API. Production runs on" >> report.md
            echo "> **Neon**, and the orphan Render instance was deleted on 2026-04-22, so this" >> report.md
            echo "> check cannot pass even with credentials. Rewriting it against Neon is" >> report.md
            echo "> Sprint 778 scope item 4." >> report.md
          else
            STATUS=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "$RENDER_API_BASE/postgres/$RENDER_POSTGRES_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "api_error")

            echo "**Instance Status:** $STATUS" >> report.md
            echo "" >> report.md

            if [ "$STATUS" = "available" ]; then
              echo "result=PASS" >> "$GITHUB_OUTPUT"
              echo "✅ Instance is available and responsive." >> report.md
            elif [ "$STATUS" = "api_error" ]; then
              echo "result=UNVERIFIED" >> "$GITHUB_OUTPUT"
              echo "⚠️ Render API did not answer. Expected while this check still points at a" >> report.md
              echo "deleted Render instance — see Sprint 778 scope item 4." >> report.md
            else
              echo "result=FAIL" >> "$GITHUB_OUTPUT"
              echo "❌ Instance status: $STATUS (expected: available)" >> report.md
            fi
          fi

      - name: Check backup availability
        id: backup-check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: ${{ secrets.RENDER_POSTGRES_ID }}
        run: |
          echo "" >> report.md
          echo "## Backup Availability" >> report.md
          echo "" >> report.md

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_POSTGRES_ID" ]; then
            echo "⚠️ Credentials unset — backup availability not checked." >> report.md
            echo "" >> report.md
            echo "> The off-provider \`pg_dump\` → R2 backup does not exist yet (Phase 4.4 was" >> report.md
            echo "> never implemented), so Neon PITR is the only thing behind production data." >> report.md
            echo "> Building it is Sprint 778 scope item 1." >> report.md
            echo "backup_available=UNVERIFIED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BACKUP_RESP=$(curl -sf -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API_BASE/postgres/$RENDER_POSTGRES_ID/backup" 2>/dev/null || echo -e "\n000")

          HTTP_CODE=$(echo "$BACKUP_RESP" | tail -1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backup metadata retrieved successfully." >> report.md
            echo "backup_available=true" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ Backup endpoint returned 404 — Render may not expose backup API." >> report.md
            echo "Compensating control: WAL archiving verified via pg_stat_archiver." >> report.md
            echo "backup_available=compensating" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Backup check failed (HTTP $HTTP_CODE)." >> report.md
            echo "backup_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: DB liveness probe
        id: db-probe
        # Sprint 778: the previous `if: env.DATABASE_URL_READONLY != ''` read the
        # job env context, where this variable is never defined — it is set in
        # this step's own `env:` below. The condition was always false, so this
        # probe had never run once. The empty case is handled in the script.
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: |
          echo "" >> report.md
          echo "## Database Liveness Probe" >> report.md
          echo "" >> report.md

          if [ -z "$DATABASE_URL_READONLY" ]; then
            echo "⚠️ \`DATABASE_URL_READONLY\` is unset — liveness probe not run." >> report.md
            echo "probe=UNVERIFIED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pip install -q psycopg2-binary 2>/dev/null

          python3 -c "
          import psycopg2, os, json
          conn = psycopg2.connect(os.environ['DATABASE_URL_READONLY'])
          cur = conn.cursor()

          # Row counts for key tables
          tables = ['users', 'clients', 'subscriptions', 'activity_logs']
          counts = {}
          for t in tables:
              cur.execute(f'SELECT COUNT(*) FROM {t}')
              counts[t] = cur.fetchone()[0]

          # WAL archiver status
          cur.execute('SELECT * FROM pg_stat_archiver')
          archiver = cur.fetchone()

          conn.close()

          print(json.dumps({'counts': counts, 'archiver_last_archived': str(archiver[1]) if archiver else 'N/A'}))
          " > probe_result.json 2>/dev/null
          PROBE_STATUS=$?

          # Sprint 778a (PR #187 review): branch on the command's exit status and
          # a NON-EMPTY result, not on the file existing. Shell redirection
          # creates probe_result.json before python starts, so a failed probe
          # leaves an empty file behind — the old `[ -f ... ]` check then wrote
          # "✅ Database responded" into the same report that carried probe=FAIL.
          # One branch now decides both the output and the report line, so they
          # cannot disagree.
          if [ "$PROBE_STATUS" -eq 0 ] && [ -s probe_result.json ]; then
            echo "probe=PASS" >> "$GITHUB_OUTPUT"
            echo "✅ Database responded to probe." >> report.md
            echo '```json' >> report.md
            cat probe_result.json >> report.md
            echo '```' >> report.md
          else
            echo "probe=FAIL" >> "$GITHUB_OUTPUT"
            echo "❌ Database probe failed (exit $PROBE_STATUS)." >> report.md
          fi

      - name: Generate final report
        id: final
        run: |
          echo "" >> report.md
          echo "---" >> report.md
          echo "" >> report.md

          RENDER_RESULT="${{ steps.render-check.outputs.result }}"
          BACKUP_RESULT="${{ steps.backup-check.outputs.backup_available }}"
          PROBE_RESULT="${{ steps.db-probe.outputs.probe }}"

          echo "| Check | Result |" >> report.md
          echo "|-------|--------|" >> report.md
          echo "| Render Postgres status | ${RENDER_RESULT:-UNVERIFIED} |" >> report.md
          echo "| Backup availability | ${BACKUP_RESULT:-UNVERIFIED} |" >> report.md
          echo "| DB liveness probe | ${PROBE_RESULT:-UNVERIFIED} |" >> report.md
          echo "" >> report.md

          # Sprint 778: the verdict used to read all three of these and branch on
          # RENDER_RESULT alone, so a failed backup check or a dead database could
          # not affect the outcome. All three now count. An empty value means the
          # step was skipped, which is UNVERIFIED rather than a pass.
          OVERALL=PASS
          for R in "${RENDER_RESULT:-UNVERIFIED}" "${BACKUP_RESULT:-UNVERIFIED}" "${PROBE_RESULT:-UNVERIFIED}"; do
            case "$R" in
              PASS|true|compensating) ;;
              FAIL|false)             OVERALL=FAIL ;;
              *)                      [ "$OVERALL" = "FAIL" ] || OVERALL=UNVERIFIED ;;
            esac
          done

          if [ "$OVERALL" = "PASS" ]; then
            echo "## Overall: ✅ PASS" >> report.md
          elif [ "$OVERALL" = "FAIL" ]; then
            echo "## Overall: ❌ FAIL" >> report.md
          else
            echo "## Overall: ⚠️ UNVERIFIED" >> report.md
            echo "" >> report.md
            echo "Nothing is known to be broken — and nothing has been verified either." >> report.md
            echo "An unverified disaster-recovery posture is not a passing one, so this run" >> report.md
            echo "is reported as a failure until Sprint 778 lands the backup and the Neon" >> report.md
            echo "rewrite." >> report.md
          fi
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"

          echo "" >> report.md
          echo "*Generated by DR Test workflow — Sprint 465*" >> report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # pin: v7.0.0
        with:
          name: dr-test-${{ steps.ts.outputs.stamp }}
          path: report.md
          retention-days: 365

      - name: Create failure issue
        if: steps.final.outputs.overall != 'PASS'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # pin: v8.0.0
        env:
          DR_VERDICT: ${{ steps.final.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DR Test ${process.env.DR_VERDICT} — ${new Date().toISOString().slice(0,7)}`,
              body: report,
              labels: ['dr-failure']
            });

      # Sprint 778: THE false-green fix. `overall` previously only gated the
      # issue above, so the job exited 0 no matter what its own report said —
      # three consecutive scheduled runs (2026-07-01, 08-01, 09-01) reported
      # workflow success while the render check resolved to FAIL. A verdict that
      # cannot fail the job is a comment, not a check.
      - name: Fail the job when the verdict is not PASS
        if: steps.final.outputs.overall != 'PASS'
        run: |
          echo "::error::DR Test verdict: ${{ steps.final.outputs.overall }} — see the report artifact and the filed issue."
          exit 1

  # MANUAL TRIGGER ONLY: This job provisions an isolated Postgres instance
  # and executes a real pg_restore. It is intentionally excluded from the
  # scheduled monthly run to control cost. Trigger via workflow_dispatch
  # at minimum once per quarter, or after any major infrastructure change.
  restore-validation:
    name: Restore Validation (Manual Only)
    runs-on: ubuntu-latest
    needs: dr-test
    # `always()` is load-bearing (Sprint 778a, PR #187 review). `needs:` implies
    # the prerequisite succeeded, so once dr-test started failing on a non-PASS
    # verdict this job silently stopped running — and the verdict is expected to
    # be UNVERIFIED until 778b lands the Neon rewrite. That would have made the
    # manual restore drill unrunnable precisely while it is most needed: an
    # untested backup is not a backup, and the drill is the half of the risk a
    # second backup mechanism does not address.
    #
    # The drill does not depend on dr-test's verdict — it provisions its own
    # isolated instance and runs its own pg_restore — so gating it on that
    # verdict was never meaningful, only accidental.
    if: always() && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pin: v6.0.2

      - name: Provision isolated PostgreSQL target
        run: |
          docker run -d \
            --name dr-restore \
            -e POSTGRES_PASSWORD=drtest \
            -p 54329:5432 \
            postgres:17
          # Wait for the instance to be ready
          for i in {1..15}; do
            pg_isready -h localhost -p 54329 -U postgres && break
            sleep 2
          done

      - name: Download latest backup artifact
        env:
          BACKUP_URL: ${{ secrets.RESTORE_TEST_BACKUP_URL }}
        run: |
          if [ -z "$BACKUP_URL" ]; then
            echo "RESTORE_TEST_BACKUP_URL secret is not set. Cannot proceed."
            exit 1
          fi
          curl -fsSL "$BACKUP_URL" -o backup.dump
          echo "Backup downloaded: $(du -sh backup.dump | cut -f1)"

      - name: Restore backup into isolated target
        run: |
          pg_restore \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --dbname postgresql://postgres:drtest@localhost:54329/postgres \
            backup.dump
          echo "pg_restore completed."

      - name: Validate schema integrity
        run: |
          psql postgresql://postgres:drtest@localhost:54329/postgres \
            -c "\dt" | grep -E "users|clients|subscriptions|activity_logs|engagements"
          echo "Schema validation passed."

      - name: Validate key table row counts
        run: |
          psql postgresql://postgres:drtest@localhost:54329/postgres \
            -c "SELECT 'users' AS tbl, COUNT(*) FROM users
                UNION ALL
                SELECT 'clients', COUNT(*) FROM clients
                UNION ALL
                SELECT 'subscriptions', COUNT(*) FROM subscriptions;"

      - name: Run Alembic migration check against restored DB
        env:
          DATABASE_URL: postgresql://postgres:drtest@localhost:54329/postgres?sslmode=disable
        run: |
          cd backend
          pip install -r requirements.txt -q
          alembic current
          echo "Migration check passed."

      - name: Backend smoke check against restored DB
        env:
          DATABASE_URL: postgresql://postgres:drtest@localhost:54329/postgres?sslmode=disable
          JWT_SECRET_KEY: dr-test-key-not-for-production
          CSRF_SECRET_KEY: dr-test-csrf-not-for-production
          ENV_MODE: test
        run: |
          cd backend
          python -c "
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              result = conn.execute(text('SELECT COUNT(*) FROM users'))
              count = result.scalar()
              print(f'Backend DB connection OK — {count} users in restored DB')
          "

      - name: Record restore test result
        if: always()
        run: |
          echo "## Restore Validation Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup source:** RESTORE_TEST_BACKUP_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Job status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Tear down isolated instance
        if: always()
        run: docker rm -f dr-restore || true
