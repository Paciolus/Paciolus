name: dependency-compliance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 07:00 UTC to catch new advisories between PRs
    - cron: '0 7 * * 1'

jobs:
  python-audit:
    name: Python CVE & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pin: v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies and audit tools
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit pip-licenses
      - name: CVE audit (fail on any known vulnerability)
        # CVE-2026-3219 (pip 26.0.1 — concatenated tar+zip archive handling) ignored while upstream
        # publishes a fixed pip release; not exploitable in our supply chain (we install from
        # vetted PyPI packages, not user-supplied archives). Re-check weekly; remove ignore once
        # a Fix Version is published. Owner: ops. Revisit: 2026-05-22.
        # Sprint 794b: through the gate so an advisory-service outage is not
        # reported as a CVE. Runs from the repo root and audits the installed
        # environment, so no `-r` is passed. `--desc` dropped: the gate needs
        # `--format json` and builds its own summary from it.
        run: bash scripts/pip_audit_gate.sh --mode blocking -- --ignore-vuln CVE-2026-3219
      - name: Export license inventory
        run: |
          pip-licenses --format=json --output-file=python-licenses.json
      - name: Upload license artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: python-licenses
          path: python-licenses.json
          retention-days: 30

  node-audit:
    name: Node CVE & License Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: CVE audit (fail on HIGH or CRITICAL)
        # Sprint 794: this is the job that went red on a 503 on 2026-10-22
        # (PR #189) with no vulnerability present. Still fails closed when the
        # audit cannot be completed, but now says which of the two happened.
        run: bash ../scripts/npm_audit_gate.sh --audit-level high --mode blocking
      - name: Export license inventory
        run: npx license-checker --production --json --out node-licenses.json
      - name: Upload license artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: node-licenses
          path: frontend/node-licenses.json
          retention-days: 30

  license-policy:
    name: License Policy Check
    runs-on: ubuntu-latest
    needs: [python-audit, node-audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # pin: v8.0.2
        with:
          name: python-licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # pin: v8.0.2
        with:
          name: node-licenses
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pin: v7.1.0
        with:
          python-version: '3.12'
      - name: Run license policy check
        run: |
          python scripts/check_license_policy.py \
            --python-licenses python-licenses.json \
            --node-licenses node-licenses.json \
            --policy docs/compliance/LICENSE_POLICY.json
