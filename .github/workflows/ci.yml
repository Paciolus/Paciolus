# Paciolus CI Pipeline — Sprint 210 (updated Sprint 800)
# Runs on every push to main and every PR targeting main.
#
# ─────────────────────────────────────────────────────────────────────────────
# GATE MANIFEST — every job below must appear in exactly one section.
#
# `backend/tests/test_ci_gate_manifest.py` parses this block and the job keys
# and fails if they disagree, so a new job cannot be added without someone
# deciding whether it blocks a merge. Keep the job-key spelling exact.
#
# This header was wrong until 2026-10-22: it claimed `openapi-drift-check` was
# a required status check (it is not) and omitted `backend-tests-postgres`
# (which is). Four gates were neither listed nor required, including the
# accounting-invariant gate — while CLAUDE.md's authority hierarchy calls
# ci.yml "mechanically enforced and final". A job that produces a red X and
# merges anyway is advisory no matter how it reads.
#
# REQUIRED — in GitHub branch protection for `main`.
# Verified against the API on 2026-10-22; `required_status_checks.contexts`
# matches the display names of exactly these jobs.
#   secrets-scan
#   backend-tests
#   backend-tests-postgres
#   frontend-build
#   frontend-tests
#   backend-lint
#   mypy-check
#   lint-baseline-gate
#   pip-audit-blocking
#   npm-audit-blocking
#   bandit
#
# ADVISORY — run on every PR, do not block merge. Each needs a reason.
#   openapi-drift-check   — SHOULD BE REQUIRED. Not yet added to branch
#                           protection; tracked in Sprint 800. A PR can change
#                           the public API surface without regenerating
#                           scripts/openapi-snapshot.json and still merge.
#   accounting-policy     — SHOULD BE REQUIRED. The five AST invariant
#                           checkers (monetary precision, audit immutability,
#                           ASC 606 contract fields, adjustment gating,
#                           framework metadata).
#   doc-consistency       — SHOULD BE REQUIRED. Catalog/tool-count claims
#                           across docs and the public OpenAPI description.
#   report-standards      — SHOULD BE REQUIRED. Report standards validator.
#   backend-tests-slow    — Long-running suite; advisory by design.
#   (pip all-severity report — an advisory *step* inside the blocking pip
#    job since Sprint 822, so requirements.txt is installed once, not twice.)
#   npm-audit-advisory    — Informational counterpart to the blocking gate.
#   merge-revert-guard    — Advisory by design.
#   e2e-smoke             — Playwright; advisory by design (flake tolerance).
#
# The four marked SHOULD BE REQUIRED need one `gh api` call against branch
# protection, which is a repository-settings change rather than a code change.
# Until it is made, this manifest is the honest description.
# ─────────────────────────────────────────────────────────────────────────────
#
# See .github/DEPLOYMENT_GOVERNANCE.md for branch protection and deployment details.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sprint 496: Least-privilege permissions — read-only by default
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets Scanning (blocking) ──────────────────────────────
  # Sprint 496: Prevent committed secrets from reaching main
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
        with:
          fetch-depth: 0

      - name: Install TruffleHog (pinned + checksum-verified)
        run: |
          TRUFFLEHOG_VERSION="3.93.8"
          EXPECTED_SHA256="b965dd2a4106dc3c194dfcaa93931fe0a93571261e3e1f46f2d1728b6612e019"
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            -o trufflehog.tar.gz
          echo "${EXPECTED_SHA256}  trufflehog.tar.gz" | sha256sum -c -
          tar -xzf trufflehog.tar.gz trufflehog
          mv trufflehog /usr/local/bin/trufflehog
          rm trufflehog.tar.gz

      - name: Scan for secrets (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          trufflehog git file://. \
            --since-commit ${{ github.event.pull_request.base.sha }} \
            --fail \
            --no-update

      - name: Scan for secrets (push — last commit)
        if: github.event_name == 'push'
        run: |
          trufflehog git file://. \
            --since-commit ${{ github.event.before }} \
            --fail \
            --no-update

  # ── Backend Tests ────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Sprint 786a — record the resolution.
      #
      # requirements.txt deliberately mixes `==` pins with `>=` floors (Sprint 777). The
      # floors self-heal against CVEs, which is why they exist, but they also mean a fresh
      # resolve can take an unreviewed upstream major at any time — pillow 12 -> 13 and
      # redis 7 -> 8 have both already happened this way. Without a recorded resolution,
      # "what did this build actually test on" is unanswerable after the fact.
      #
      # Printed for the floor-pinned set so a reviewer sees the moving parts in the log,
      # and uploaded in full as an artifact for later forensics.
      - name: Record resolved dependency versions
        if: matrix.python-version == '3.12'
        run: |
          pip freeze > resolved-requirements.txt
          # Derive the floor-pinned set from requirements.txt rather than restating it.
          # The first draft hardcoded 10 names when the file has 15, and included two
          # packages that are not floors at all (PR #178 review).
          FLOORS=$(grep -oE '^[a-zA-Z0-9_.-]+>=' requirements.txt | sed 's/>=$//' | paste -sd'|' -)
          echo "::group::Resolved versions for the $(echo "$FLOORS" | tr "|" "\n" | wc -l) floor-pinned (>=) packages"
          grep -iE "^(${FLOORS})==" resolved-requirements.txt \
            || echo "(no floor-pinned packages matched — check the FLOORS pattern)"
          echo "::endgroup::"

      - name: Upload resolved dependency versions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: resolved-requirements-py312
          path: backend/resolved-requirements.txt
          retention-days: 90
          # upload-artifact defaults overwrite:false and fails if the name already
          # exists in the run. Rerunning only the failed Backend Tests job reuses the
          # run, so without this a rerun dies at the upload instead of at the real
          # failure (PR #178 review).
          overwrite: true

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          API_HOST=0.0.0.0
          API_PORT=8000
          CORS_ORIGINS=http://localhost:3000
          ENV_MODE=development
          DATABASE_URL=sqlite:///./test.db
          EOF

      - name: Run pytest (exclude slow tests on PRs)
        run: pytest tests/ -v --tb=short -q --cov=. --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80 -m "not slow"

      # Sprint 723 — per-file coverage floor enforcement.
      # Catches *targeted* regressions in the worst-covered production-critical
      # files; the global --cov-fail-under=80 above only catches *aggregate* drops.
      - name: Check per-file coverage floors
        run: python ../scripts/check_coverage_floors.py coverage.json ../backend/coverage_floors.toml

      # Sprint 802: the overnight agents' own test suite ran nowhere.
      #
      # `scripts/overnight/tests/` holds the regression tests for the nightly
      # agents — including the Sprint 712 false-green guard, which exists
      # because a nightly once reported 0 passed / 0 failed as GREEN. It was
      # referenced by no workflow, so the tests protecting the thing that
      # watches the build were themselves unwatched.
      #
      # Run from the repo root, not backend/: these import the `scripts`
      # namespace package, and `backend/scripts/` would shadow it.
      - name: Run overnight agent tests
        working-directory: .
        run: python -m pytest scripts/overnight/tests/ -q --tb=short

  # ── OpenAPI Schema Drift Check (Sprint 518: DEC F-020) ──────
  # Detects when backend Pydantic models diverge from the committed
  # OpenAPI snapshot. If drift is found, developers must run
  # `python scripts/generate_openapi_snapshot.py` and commit the result.
  openapi-drift-check:
    name: OpenAPI Schema Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check for OpenAPI drift
        run: python scripts/check_openapi_drift.py

      # Sprint 726 Phase 1 — advisory output, exit 0 on findings.
      # Promoted to a hard gate by Sprint 727 once the 9 off-pattern testing
      # engines have been migrated. See docs/03-engineering/adr-013-audit-engine-base.md.
      - name: AuditEngineBase adoption (advisory)
        run: python scripts/lint_engine_base_adoption.py
        continue-on-error: true

      # Sprint 756 — domain relocation lint (advisory). Surfaces the engines
      # not yet relocated to services/audit/<tool>/ per ADR-018. Migrates
      # incrementally per sub-sprint; flips to a hard gate when the migration
      # backlog reaches a critical mass.
      - name: Domain package relocation (advisory)
        run: python scripts/lint_domain_relocation.py
        continue-on-error: true

      # Sprint 756 — route layer purity lint (advisory). Surfaces routes that
      # import engine orchestration symbols (run_*, *Engine classes), bypassing
      # the service layer per ADR-015. Flips to a hard gate when the route
      # thinning backlog clears.
      - name: Route layer purity (advisory)
        run: python scripts/lint_route_layer_purity.py
        continue-on-error: true

  # ── Backend Tests (PostgreSQL) ──────────────────────────────
  backend-tests-postgres:
    name: Backend Tests (PostgreSQL 15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: paciolus
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: paciolus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paciolus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install psycopg2-binary

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          API_HOST=0.0.0.0
          API_PORT=8000
          CORS_ORIGINS=http://localhost:3000
          ENV_MODE=development
          DATABASE_URL=sqlite:///./test.db
          EOF

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://paciolus:testpass@localhost:5432/paciolus_test
        run: pytest tests/ -v --tb=short -q --cov=. --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80 -m "not slow"

      # Sprint 723 — per-file coverage floor enforcement (PG path).
      - name: Check per-file coverage floors
        run: python ../scripts/check_coverage_floors.py coverage.json ../backend/coverage_floors.toml

  # ── Slow Tests (nightly / main-only) ─────────────────────────
  backend-tests-slow:
    name: Backend Slow Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          API_HOST=0.0.0.0
          API_PORT=8000
          CORS_ORIGINS=http://localhost:3000
          ENV_MODE=development
          DATABASE_URL=sqlite:///./test.db
          EOF

      - name: Run slow tests
        run: pytest tests/ -v --tb=short -q -m slow

  # ── Frontend Build ───────────────────────────────────────────
  frontend-build:
    name: Frontend Build + Lint
    runs-on: ubuntu-latest
    outputs:
      eslint_errors: ${{ steps.eslint_count.outputs.eslint_errors }}
      eslint_warnings: ${{ steps.eslint_count.outputs.eslint_warnings }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (full report)
        run: |
          npx eslint . > eslint-full-report.txt 2>&1 || true
          tail -5 eslint-full-report.txt

      - name: Count eslint issues
        id: eslint_count
        run: |
          npx eslint . --format json 2>/dev/null | node -e "
            const data = require('fs').readFileSync('/dev/stdin','utf8');
            const files = JSON.parse(data);
            let errors = 0, warnings = 0;
            for (const f of files) {
              for (const m of f.messages || []) {
                if (m.severity === 2) errors++;
                else warnings++;
              }
            }
            console.log('eslint_errors=' + errors);
            console.log('eslint_warnings=' + warnings);
            process.stderr.write('ESLint errors: ' + errors + ' (baseline: 0), warnings: ' + warnings + ' (baseline: 0)\n');
          " >> "$GITHUB_OUTPUT" || true

      - name: Upload eslint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: eslint-lint-report
          path: frontend/eslint-full-report.txt
          retention-days: 30

  # ── Frontend Tests (blocking) ──────────────────────────────
  # Sprint 496: 1,345 tests exist but were never gated in CI
  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npx jest --ci --forceExit --coverage

  # ── Backend Lint ─────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    outputs:
      ruff_errors: ${{ steps.ruff_count.outputs.ruff_errors }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (statistics report)
        run: |
          ruff check . --statistics > ruff-statistics.txt 2>&1 || true
          cat ruff-statistics.txt

      - name: Run ruff (full report)
        run: |
          ruff check . --output-format concise > ruff-full-report.txt 2>&1 || true

      - name: Count ruff errors
        id: ruff_count
        run: |
          COUNT=$(ruff check . --output-format json 2>/dev/null | python -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "ruff_errors=$COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::Ruff errors: $COUNT (baseline: 0)"

      - name: Upload ruff reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: ruff-lint-report
          path: |
            backend/ruff-statistics.txt
            backend/ruff-full-report.txt
          retention-days: 30

  # ── Backend Type Check (baseline-gated) ─────────────────────
  # Mypy has ~1,009 pre-existing errors (systemic Column[int]/Decimal/float
  # mismatches + missing annotations). Gate: fail only if errors increase.
  mypy-check:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run mypy (non-test source, baseline-gated)
        run: |
          BASELINE=$(python -c "import json; print(json.load(open('../.github/lint-baseline.json')).get('mypy', {}).get('total_errors', 1009))")
          mypy . --exclude tests/ --no-error-summary 2>&1 | tee mypy-report.txt || true
          CURRENT=$(grep -c ': error:' mypy-report.txt || echo 0)
          echo "mypy: current=$CURRENT, baseline=$BASELINE"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::error::mypy errors increased from $BASELINE to $CURRENT. Fix new type errors before merging."
            exit 1
          fi
          echo "✓ mypy errors within baseline ($CURRENT ≤ $BASELINE)"

  # ── Lint Baseline Gate (no increase) ─────────────────────────
  lint-baseline-gate:
    name: Lint Baseline Gate
    needs: [backend-lint, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - name: Check ruff baseline
        env:
          RUFF_ERRORS: ${{ needs.backend-lint.outputs.ruff_errors }}
        run: |
          BASELINE=$(python -c "import json; print(json.load(open('.github/lint-baseline.json'))['ruff']['total_errors'])")
          CURRENT="${RUFF_ERRORS:-0}"
          echo "Ruff: current=$CURRENT, baseline=$BASELINE"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::error::Ruff errors increased from $BASELINE to $CURRENT. Fix new lint issues before merging."
            exit 1
          fi
          echo "✓ Ruff errors within baseline ($CURRENT ≤ $BASELINE)"

      - name: Check eslint baseline
        env:
          ESLINT_ERRORS: ${{ needs.frontend-build.outputs.eslint_errors }}
          ESLINT_WARNINGS: ${{ needs.frontend-build.outputs.eslint_warnings }}
        run: |
          BASELINE_ERR=$(python -c "import json; print(json.load(open('.github/lint-baseline.json'))['eslint']['total_errors'])")
          BASELINE_WARN=$(python -c "import json; print(json.load(open('.github/lint-baseline.json'))['eslint']['total_warnings'])")
          CURR_ERR="${ESLINT_ERRORS:-0}"
          CURR_WARN="${ESLINT_WARNINGS:-0}"
          echo "ESLint errors: current=$CURR_ERR, baseline=$BASELINE_ERR"
          echo "ESLint warnings: current=$CURR_WARN, baseline=$BASELINE_WARN"
          FAIL=0
          if [ "$CURR_ERR" -gt "$BASELINE_ERR" ]; then
            echo "::error::ESLint errors increased from $BASELINE_ERR to $CURR_ERR."
            FAIL=1
          fi
          if [ "$CURR_WARN" -gt "$BASELINE_WARN" ]; then
            echo "::error::ESLint warnings increased from $BASELINE_WARN to $CURR_WARN."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "Fix new lint issues before merging."
            exit 1
          fi
          echo "✓ ESLint within baseline (errors: $CURR_ERR ≤ $BASELINE_ERR, warnings: $CURR_WARN ≤ $BASELINE_WARN)"

  # ── SAST: Bandit Security Scanner (blocking) ─────────────────
  bandit:
    name: Security SAST (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (medium+ severity)
        run: bandit -r . -ll --exclude ./tests,./venv -f json -o bandit-report.json || true

      - name: Check for HIGH/CRITICAL findings
        run: |
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              report = json.load(f)
          high = [r for r in report.get('results', [])
                  if r.get('issue_severity') in ('HIGH',)
                  and r.get('issue_confidence') in ('HIGH', 'MEDIUM')]
          if high:
              print(f'::error::Bandit found {len(high)} HIGH-severity finding(s):')
              for r in high:
                  print(f'  {r[\"filename\"]}:{r[\"line_number\"]} - {r[\"issue_text\"]}')
              sys.exit(1)
          print('No HIGH-severity findings detected.')
          "

  # ── Accounting Policy Gate ───────────────────────────────────
  accounting-policy:
    name: Accounting Policy Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
      - name: Run accounting policy guard
        run: python -m guards.accounting_policy_guard

  # ── Report Standards Gate ────────────────────────────────────
  report-standards:
    name: Report Standards Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run report standards validator
        run: python scripts/validate_report_standards.py

  # ── Documentation Consistency Gate ──────────────────────────
  doc-consistency:
    name: Documentation Consistency Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
      - name: Run documentation consistency guard
        run: python -m guards.doc_consistency_guard

      # Sprint 807 (finding C-1): every external host in the CSP allowlist and
      # every configured storage bucket must map to an entry in
      # SUBPROCESSOR_LIST.md. Cloudflare R2 held customer export bytes for six
      # months without appearing on that list, while the DPA committed in
      # writing to maintaining it — because nothing was checking.
      - name: Run subprocessor coverage gate
        working-directory: .
        run: python scripts/lint_subprocessors.py

      # Sprint 809 (findings D-2 / D-3): extends the design-token gate beyond
      # "is this a generic Tailwind colour" to "does this brand token exist"
      # and "is this shade legible". `text-content-muted` had 36 live usages and
      # emitted zero CSS; `sage-500` fails WCAG AA on both page surfaces.
      - name: Run design token gate
        working-directory: .
        run: python scripts/lint_design_tokens.py

  # ── Dependency Audit: pip (blocking on HIGH/CRITICAL) ────────
  pip-audit-blocking:
    name: Python Dependency Audit (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit and project dependencies
        run: |
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit for HIGH/CRITICAL vulnerabilities
        # Sprint 794b: via the gate script, which retries and then
        # distinguishes "vulnerable" from "could not reach the service".
        # pip-audit exits 1 for both, so an index outage looked exactly like a
        # real finding — the same defect 794a fixed on the npm side.
        run: bash ../scripts/pip_audit_gate.sh --mode blocking -- -r requirements.txt

      - name: Audit all vulnerabilities (advisory)
        # Sprint 822: formerly its own job, which installed the full
        # requirements.txt a second time. Same environment, so a separate step.
        # `if: always()` keeps the full report when the blocking step fails;
        # `continue-on-error` keeps this step from failing the required check.
        # Sprint 794b: `--desc` is dropped deliberately — it does nothing
        # alongside `--format json`, which the gate requires.
        if: always()
        continue-on-error: true
        run: bash ../scripts/pip_audit_gate.sh --mode advisory -- -r requirements.txt

  # ── Dependency Audit: npm (blocking on HIGH/CRITICAL) ────────
  npm-audit-blocking:
    name: Node Dependency Audit (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for HIGH/CRITICAL vulnerabilities
        # Sprint 794: via the gate script, which retries and then distinguishes
        # "vulnerable" from "could not reach the registry". The bare command
        # exits 1 for both, so a 503 used to look exactly like a CRITICAL.
        run: bash ../scripts/npm_audit_gate.sh --audit-level high --mode blocking

  # ── Merge Revert Guard (advisory) ────────────────────────────
  merge-revert-guard:
    name: Merge Revert Guard (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"

      - name: Detect silent reverts
        run: python scripts/detect_silent_reverts.py --pr-count 15 --overlap-threshold 3

  # ── Dependency Audit: npm (advisory — all severities) ────────
  npm-audit-advisory:
    name: Node Dependency Audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit all vulnerabilities (advisory)
        # Sprint 794: advisory mode always exits 0; the job already carries
        # continue-on-error, but going through the gate means the log says
        # whether the audit actually ran rather than leaving it ambiguous.
        run: bash ../scripts/npm_audit_gate.sh --audit-level low --mode advisory

  # ── E2E Smoke Tests (Playwright) ────────────────────────────
  # Requires SMOKE_USER and SMOKE_PASS secrets in GitHub Actions.
  # Runs on push to main and on PRs targeting main (skips gracefully if secrets unavailable).
  e2e-smoke:
    name: E2E Smoke Tests (Playwright)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pin: v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # pin: v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          API_HOST=0.0.0.0
          API_PORT=8000
          CORS_ORIGINS=http://localhost:3000
          ENV_MODE=development
          DATABASE_URL=sqlite:///./test.db
          EOF
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Start frontend
        run: |
          npx next start -p 3000 &
          sleep 5

      - name: Check smoke test secrets
        id: smoke_secrets
        run: |
          if [ -n "${{ secrets.SMOKE_USER }}" ] && [ -n "${{ secrets.SMOKE_PASS }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Smoke test secrets not available — skipping E2E tests (expected on external PRs)"
          fi

      - name: Run E2E smoke tests
        if: steps.smoke_secrets.outputs.available == 'true'
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: npx playwright test e2e/smoke.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pin: v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
